# Configuration Netlify du site Dark Side Energy
# Le site est statique : le dossier publié est "site/".
# La commande de build réassemble en-têtes, pieds de page et sitemap (sans dépendance).

[build]
  publish = "site"
  command = "node tools/build.mjs"

[build.environment]
  NODE_VERSION = "22"

# --- Redirections des anciennes adresses du site Wix (301 = permanent, conserve le référencement) ---

[[redirects]]
  from = "/test-externe"
  to = "/bilan-de-puissance/"
  status = 301

[[redirects]]
  from = "/accueil"
  to = "/"
  status = 301

[[redirects]]
  from = "/single-post/2016/05/25/*"
  to = "/news/creation-dark-side-energy/"
  status = 301

[[redirects]]
  from = "/single-post/2016/05/26/*"
  to = "/news/fetes-maritimes-brest-2016/"
  status = 301

[[redirects]]
  from = "/single-post/2016/06/23/*"
  to = "/news/repertoire-national-des-electros/"
  status = 301

[[redirects]]
  from = "/single-post/2016/10/06/*"
  to = "/news/lille-grand-palais-2016/"
  status = 301

[[redirects]]
  from = "/single-post/saistucequestladistributionelectrique"
  to = "/news/distribution-electrique-evenementielle/"
  status = 301

[[redirects]]
  from = "/single-post/2017/05/08/le-sais-tu-quest-ce-quun-groupe-twin-*"
  to = "/news/groupe-twin-zero-coupure/"
  status = 301

[[redirects]]
  from = "/single-post/2017/05/08/le-sais-tu-la-section-*"
  to = "/news/section-de-cable/"
  status = 301

[[redirects]]
  from = "/single-post/2017/05/08/le-sais-tu-pourquoi-*"
  to = "/news/pourquoi-ca-saute/"
