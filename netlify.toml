# --- En-têtes HTTP ---

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-qOhFsq0QMV2REqNwk5hGH5bZE9SkX6gt6yeyKdYPv+U=' 'sha256-tMr51a4Mob//DIOK6u7rVuJFtxXEI3vhGVHlPQn243U=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Page privée des résultats du questionnaire (ouverte avec un lien secret) : jamais indexée
[[headers]]
  for = "/resultats/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Versions Markdown des pages et fichiers pour les IA : bon encodage, et pas d'indexation
# en doublon dans Google (les pages HTML restent les pages de référence)
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Flux RSS des articles (repris par les outils de publication sur les réseaux sociaux)
[[headers]]
  for = "/*/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex, follow"

# Calculette hors ligne : le service worker est toujours revérifié, pour que les mises à jour arrivent
[[headers]]
  for = "/calculette-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
