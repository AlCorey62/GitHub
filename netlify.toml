# Configuration Netlify du site Dark Side Energy
# Le site est statique : le dossier publié est "site/".
# La commande de build réassemble en-têtes, pieds de page et sitemap (sans dépendance).

[build]
  publish = "site"
  command = "node tools/build.mjs"

[build.environment]
  NODE_VERSION = "22"

# Signalement des pages nouvelles ou modifiées à IndexNow (Bing, Copilot, ChatGPT) après chaque mise en ligne
# en production. Voir netlify/plugins/indexnow/index.js.
[[plugins]]
  package = "./netlify/plugins/indexnow"

