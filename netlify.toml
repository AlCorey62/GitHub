[[redirects]]
  from = "/single-post/*"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/news/"
  status = 301

# --- Version anglaise (/en/) ---
# Anciennes adresses anglaises de Wix (mêmes noms que les pages françaises) vers les pages anglaises.
# Ces règles ne s'appliquent que si aucun fichier n'existe à l'adresse demandée.

[[redirects]]
  from = "/en/accueil"
  to = "/en/"
  status = 301

[[redirects]]
