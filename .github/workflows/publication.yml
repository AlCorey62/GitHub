# Publication programmée des articles « Le sais-tu ? » (voir tools/publier.mjs et editorial/README.md).
# Chaque matin, les articles validés de editorial/a-paraitre/ dont la date est arrivée sont mis en ligne :
# la tâche les place dans site/, reconstruit le site, lance les contrôles et pousse sur main (Netlify publie).
# Mise en place avec l'accord de Damien (19/10/2026).
name: Publication programmée

on:
  schedule:
    - cron: "17 4 * * *" # 4 h 17 UTC : 6 h 17 à Paris l'été, 5 h 17 l'hiver
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      PUBLICATION_RESUME: ${{ github.workspace }}/../resume-publication.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Articles du jour
        id: pub
        run: |
          node tools/publier.mjs
          if [ -s "$PUBLICATION_RESUME" ]; then echo "publie=oui" >> "$GITHUB_OUTPUT"; fi

      - name: Construction et contrôles
        if: steps.pub.outputs.publie == 'oui'
        run: |
          node tools/build.mjs
          node tools/check.mjs
          node --test
          node tools/wix-kit.mjs

      - name: Envoi sur main
        if: steps.pub.outputs.publie == 'oui'
        run: |
          git config user.name "Publication programmée"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          { echo "Publication programmée du $(TZ=Europe/Paris date +%d/%m/%Y)"; echo; cat "$PUBLICATION_RESUME"; } > ../message-publication.txt
          git commit -F ../message-publication.txt
          git pull --rebase origin main
          git push origin HEAD:main
