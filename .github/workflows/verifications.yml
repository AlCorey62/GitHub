name: Vérifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Fichiers générés à jour
        run: npm run check
      - name: Tests unitaires
        run: npm test
      - name: Tests de bout en bout
        run: npm run test:e2e
