<!doctype html>
<!-- Vidéo « Inverseur de sources : normal, secours » (24 s). Textes repris du lexique du site (« Inverseur de sources ») :
     bascule du réseau vers un groupe électrogène de secours, verrouillage, brève coupure au basculement. -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
</head>
<body>
<h1 class="title" id="title">Inverseur de sources :<br><em>normal, secours</em>,<br>comment ça marche ?</h1>
<svg class="diag" id="diag" viewBox="0 0 1080 600">
  <!-- câbles -->
  <path class="wire" d="M330 150 H420 V250 H500" /><path class="wire" d="M330 450 H420 V350 H500" /><path class="wire" d="M650 300 H800" />
  <path class="flow" id="f1" d="M330 150 H420 V250 H500" /><path class="flow" id="f2" d="M330 450 H420 V350 H500" /><path class="flow" id="f3" d="M650 300 H800" />
  <!-- sources -->
  <g id="g1"><rect class="box" x="72" y="80" width="258" height="140" rx="14"/><text class="lbl" x="98" y="132">Réseau</text><text class="small" x="98" y="176">source normale</text>
    <g id="x1" opacity="0"><line x1="262" y1="104" x2="310" y2="152" stroke="#ff4a3d" stroke-width="10" stroke-linecap="round"/><line x1="310" y1="104" x2="262" y2="152" stroke="#ff4a3d" stroke-width="10" stroke-linecap="round"/></g></g>
  <g id="g2"><rect class="box" x="72" y="380" width="258" height="140" rx="14"/><text class="lbl" x="98" y="432">Groupe</text><text class="small" x="98" y="476">source de secours</text></g>
  <!-- inverseur : deux contacts à gauche, un bras qui pivote à droite -->
  <rect class="box" x="470" y="200" width="210" height="200" rx="14"/>
  <text class="small" x="575" y="186" text-anchor="middle">Inverseur</text>
  <circle cx="500" cy="250" r="11" fill="#b4b4bb"/><circle cx="500" cy="350" r="11" fill="#b4b4bb"/><circle cx="650" cy="300" r="11" fill="#b4b4bb"/>
  <line id="arm" x1="650" y1="300" x2="500" y2="250" stroke="#f3f3f4" stroke-width="10" stroke-linecap="round"/>
  <!-- installation -->
  <g><rect class="box" x="800" y="210" width="208" height="180" rx="14"/><text class="lbl" x="822" y="262">Installation</text>
    <circle id="led" cx="972" cy="340" r="14" fill="#ff4a3d"/></g>
  <g class="badge" id="badge" opacity="0"><rect x="400" y="486" width="560" height="64" rx="32"/><text x="680" y="528" text-anchor="middle">JAMAIS LES DEUX ENSEMBLE</text></g>
</svg>
<div class="outro" id="outro"><p class="kicker">Le sais-tu ?</p><h2>Une source,<br>puis l'autre :<br><em>jamais les deux</em>.</h2><p>Définition dans le lexique de darkside-energy.com</p></div>
<script>
window.VIDEO = {
  duration: 24,
  caps: [
    [3.6, 8.0, "En temps normal, le réseau <em>alimente l'installation</em>."],
    [8.0, 12.2, "Coupure du réseau : l'installation <em>n'est plus alimentée</em>."],
    [12.2, 16.6, "L'inverseur bascule sur le groupe : <em>brève coupure</em>, puis le courant revient."],
    [16.6, 20.6, "Un verrouillage empêche les deux sources d'alimenter le circuit <em>en même temps</em>."],
  ],
  scene(t, { ease, win }) {
    const $ = (id) => document.getElementById(id);
    $("title").style.opacity = win(t, 0.2, 3.4, 0.5);
    $("title").style.transform = `translateY(${(1 - ease((t - 0.2) / 0.6)) * 30}px)`;
    $("diag").style.opacity = win(t, 3.4, 20.8, 0.6);
    const coupure = ease((t - 8.2) / 0.4); // le réseau tombe
    const bascule = ease((t - 12.6) / 0.9); // le bras passe du réseau au groupe
    const retour = ease((t - 13.7) / 0.4); // le groupe alimente
    $("x1").setAttribute("opacity", coupure);
    $("g1").style.opacity = 1 - 0.45 * coupure;
    $("f1").style.opacity = 1 - coupure;
    $("f2").style.opacity = retour;
    const alim = Math.max(1 - coupure, retour);
    $("f3").style.opacity = alim;
    $("led").setAttribute("opacity", 0.15 + 0.85 * alim * (0.8 + 0.2 * Math.sin(t * 6)));
    $("arm").setAttribute("y2", 250 + 100 * bascule);
    for (const id of ["f1", "f2", "f3"]) $(id).style.strokeDashoffset = -t * 120;
    $("badge").setAttribute("opacity", t < 20.6 ? ease((t - 16.9) / 0.5) : 0);
    const o = ease((t - 20.8) / 0.7);
    $("outro").style.opacity = o;
    $("kicker").style.opacity = 1 - o;
  },
};
</script>
<script src="_base.js"></script>
</body></html>
