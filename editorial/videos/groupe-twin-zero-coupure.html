<!doctype html>
<!-- Vidéo « Groupe Twin zéro coupure » (24 s). Textes repris de l'article /news/groupe-twin-zero-coupure/ et du lexique (« Groupe Twin zéro coupure »). -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
</head>
<body>
<h1 class="title" id="title">Groupe Twin :<br><em>zéro coupure</em>,<br>comment ça marche ?</h1>
<svg class="diag" id="diag" viewBox="0 0 1080 600">
  <path class="wire" d="M330 150 H520 V300 H560" /><path class="wire" d="M330 450 H520 V300 H560" /><path class="wire" d="M760 300 H800" />
  <path class="flow" id="f1" d="M330 150 H520 V300 H560" /><path class="flow" id="f2" d="M330 450 H520 V300 H560" /><path class="flow" id="f3" d="M760 300 H800" />
  <g id="g1"><rect class="box" x="72" y="80" width="258" height="140" rx="14"/><text class="lbl" x="98" y="130">Groupe 1</text><text class="pct" id="p1" x="98" y="190">50 %</text>
    <g id="x1" opacity="0"><line x1="262" y1="104" x2="310" y2="152" stroke="#ff4a3d" stroke-width="10" stroke-linecap="round"/><line x1="310" y1="104" x2="262" y2="152" stroke="#ff4a3d" stroke-width="10" stroke-linecap="round"/><text class="small" x="248" y="196">panne</text></g></g>
  <g id="g2"><rect class="box" x="72" y="380" width="258" height="140" rx="14"/><text class="lbl" x="98" y="430">Groupe 2</text><text class="pct" id="p2" x="98" y="490">50 %</text></g>
  <rect class="box" x="560" y="240" width="200" height="120" rx="14"/><text class="lbl" x="586" y="292">Couplage</text><text class="small" x="586" y="330">synchronisé</text>
  <g><rect class="box" x="800" y="210" width="208" height="180" rx="14"/><text class="lbl" x="822" y="262">Régie</text><text class="small" x="822" y="300">son, lumière,</text><text class="small" x="822" y="332">ordinateurs</text>
    <circle id="led" cx="972" cy="246" r="12" fill="#ff4a3d"/></g>
  <g class="badge" id="badge" opacity="0"><rect x="684" y="420" width="360" height="64" rx="32"/><text x="864" y="462" text-anchor="middle">AUCUNE COUPURE</text></g>
</svg>
<div class="outro" id="outro"><p class="kicker">Le sais-tu ?</p><h2>Deux groupes,<br>une charge,<br><em>zéro coupure</em>.</h2><p>Toute l'explication sur darkside-energy.com</p></div>
<script>
window.VIDEO = {
  duration: 24,
  caps: [
    [3.6, 8.2, "Deux groupes <em>synchronisés</em> fournissent chacun 50 % de la charge."],
    [8.2, 12.6, "Si l'un tombe en panne, l'autre reprend <em>toute la charge</em>."],
    [12.6, 17.0, "Il tourne déjà : ordinateurs et consoles <em>restent alimentés</em>."],
    [17.0, 20.6, "Chaque groupe est dimensionné pour reprendre <em>seul</em> toute la charge."],
  ],
  scene(t, { ease, win }) {
    const $ = (id) => document.getElementById(id);
    $("title").style.opacity = win(t, 0.2, 3.4, 0.5);
    $("title").style.transform = `translateY(${(1 - ease((t - 0.2) / 0.6)) * 30}px)`;
    $("diag").style.opacity = win(t, 3.4, 20.8, 0.6);
    const panne = t >= 8.6;
    const reprise = ease((t - 8.8) / 1.0);
    $("x1").setAttribute("opacity", panne ? ease((t - 8.6) / 0.4) : 0);
    $("g1").style.opacity = panne ? 1 - 0.45 * ease((t - 8.6) / 0.5) : 1;
    $("f1").style.opacity = panne ? 1 - ease((t - 8.6) / 0.3) : 1;
    for (const id of ["f1", "f2", "f3"]) $(id).style.strokeDashoffset = -t * 120;
    $("p1").textContent = panne ? "0 %" : "50 %";
    $("p2").textContent = `${Math.round(50 + 50 * reprise)} %`;
    $("led").setAttribute("opacity", 0.75 + 0.25 * Math.sin(t * 6));
    $("badge").setAttribute("opacity", t < 20.6 ? ease((t - 10.2) / 0.5) : 0);
    const o = ease((t - 20.8) / 0.7);
    $("outro").style.opacity = o;
    $("kicker").style.opacity = 1 - o;
  },
};
</script>
<script src="_base.js"></script>
</body></html>
